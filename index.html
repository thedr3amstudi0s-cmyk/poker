<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;

            /* Cool animated background */
            background:
                radial-gradient(circle at 20% 30%, #4f46e5 0%, transparent 35%),
                radial-gradient(circle at 80% 70%, #9333ea 0%, transparent 35%),
                linear-gradient(135deg, #050816, #111827, #030712);
            background-size: 200% 200%;
            animation: backgroundMove 12s ease infinite;
        }

        @keyframes backgroundMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Floating glow */
        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.35;
            pointer-events: none;
        }

        body::before {
            background: #6366f1;
            top: -100px;
            left: -100px;
            animation: float1 8s ease-in-out infinite;
        }

        body::after {
            background: #c026d3;
            bottom: -100px;
            right: -100px;
            animation: float2 10s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(120px, 80px);
            }
        }

        @keyframes float2 {
            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-100px, -80px);
            }
        }

        /* Center content */
        .container {
            position: relative;
            z-index: 2;

            width: min(90%, 900px);
            padding: 50px;

            text-align: center;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px;

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.4),
                inset 0 1px rgba(255, 255, 255, 0.1);
        }

        .text {
            color: white;
            font-size: clamp(2rem, 7vw, 5rem);
            font-weight: 800;
            letter-spacing: -2px;

            text-shadow:
                0 0 20px rgba(255, 255, 255, 0.25);

            word-wrap: break-word;
        }

        @media (max-width: 600px) {
            .container {
                padding: 35px 20px;
            }

            .text {
                letter-spacing: -1px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- CHANGE THIS TEXT -->
        <div class="text">
            629-654-0201
        </div>
    </div>

</body>
</html>
